<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Profile - Expense Tracker</title>
	<link rel="stylesheet" href="css/style.css">
</head>

<body>
	<div class="nav">
		<a class="brand" href="dashboard.html">&#x1F4B0; Expense Tracker</a>
		<div>
			<a href="dashboard.html">Dashboard</a> <a href="expenses.html">Expenses</a>
			<a href="profile.html" class="active">Profile</a>
		</div>
		<div class="right">
			<span id="userName">&#x1F464; User</span><a href="#" id="logoutBtn">Logout</a>
		</div>
	</div>
	<div class="container">
		<h2>My Profile</h2>

		<div id="alertContainer"></div>

		<div class="row">
			<div class="col">
				<div class="card">
					<div class="card-header">Profile Information</div>
					<div class="card-body">
						<form id="profileForm">
							<input type="hidden" name="action" value="updateProfile">
							<label for="name">Full Name</label> <input type="text" id="name" name="name" required>
							<label for="email">Email
								Address</label> <input type="email" id="email" name="email" required>
							<label>Member Since</label> <input type="text" id="memberSince" disabled>
							<button type="submit" class="btn btn-primary">Update
								Profile</button>
						</form>
					</div>
				</div>
			</div>
			<div class="col">
				<div class="card">
					<div class="card-header">Change Password</div>
					<div class="card-body">
						<form id="passwordForm">
							<input type="hidden" name="action" value="changePassword">
							<label for="currentPassword">Current Password</label> <input type="password"
								id="currentPassword" name="currentPassword" placeholder="Enter current password"
								required> <label for="newPassword">New Password</label> <input type="password"
								id="newPassword" name="newPassword" placeholder="At least 6 characters" minlength="6"
								required>
							<div class="hint">Password must be at least 6 characters
								long.</div>
							<label for="confirmPassword">Confirm New Password</label> <input type="password"
								id="confirmPassword" name="confirmPassword" placeholder="Confirm new password"
								minlength="6" required>
							<button type="submit" class="btn btn-warning">Change
								Password</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="footer">&copy; 2026 Expense Tracker</div>

	<script>
		document.addEventListener('DOMContentLoaded', function () {
			loadProfile();

			document.getElementById('profileForm').addEventListener('submit', function (e) {
				e.preventDefault();
				var formData = new FormData(this);
				fetch('api/profile', {
					method: 'POST',
					body: new URLSearchParams(formData)
				})
					.then(function (r) {return r.json();})
					.then(function (data) {
						if (data.success) {
							showAlert(data.message, 'success');
							document.getElementById('userName').textContent = '&#x1F464; ' + data.user.name;
						} else {
							showAlert(data.error, 'danger');
						}
					})
					.catch(function () {showAlert('Connection error', 'danger');});
			});

			document.getElementById('passwordForm').addEventListener('submit', function (e) {
				e.preventDefault();
				var formData = new FormData(this);
				fetch('api/profile', {
					method: 'POST',
					body: new URLSearchParams(formData)
				})
					.then(function (r) {return r.json();})
					.then(function (data) {
						if (data.success) {
							showAlert(data.message, 'success');
							document.getElementById('passwordForm').reset();
						} else {
							showAlert(data.error, 'danger');
						}
					})
					.catch(function () {showAlert('Connection error', 'danger');});
			});

			document.getElementById('logoutBtn').addEventListener('click', function (e) {
				e.preventDefault();
				fetch('api/logout', {method: 'POST'})
					.then(function (r) {return r.json();})
					.then(function () {window.location.href = 'login.html';})
					.catch(function () {window.location.href = 'login.html';});
			});
		});

		function loadProfile() {
			fetch('api/profile')
				.then(function (r) {return r.json();})
				.then(function (data) {
					if (!data.success) {window.location.href = 'login.html'; return;}
					var u = data.user;
					document.getElementById('userName').textContent = '&#x1F464; ' + u.name;
					document.getElementById('name').value = u.name;
					document.getElementById('email').value = u.email;
					document.getElementById('memberSince').value = u.createdAt || '';
				})
				.catch(function () {window.location.href = 'login.html';});
		}

		function showAlert(msg, type) {
			var container = document.getElementById('alertContainer');
			container.innerHTML = '<div class="alert alert-' + type + '"><span>' + (type === 'success' ? '&#x2714;' : '&#x26A0;') + ' ' + msg + '</span><button class="close" onclick="this.parentElement.style.display=\'none\'">&times;</button></div>';
			setTimeout(function () {container.innerHTML = '';}, 5000);
		}
	</script>
</body>

</html>
