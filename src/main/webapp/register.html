<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Register - Expense Tracker</title>
	<link rel="stylesheet" href="css/style.css">
	<style>
		body {
			background: linear-gradient(135deg, #4361ee, #2d4bc8);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center
		}

		.card {
			max-width: 400px;
			padding: 40px;
			margin: 0
		}

		h1 {
			text-align: center;
			color: #4361ee;
			margin-bottom: 4px
		}

		.card p {
			text-align: center;
			color: #666;
			margin-bottom: 24px;
			font-size: 14px
		}

		button[type="submit"] {
			width: 100%;
			padding: 12px;
			background: #4361ee;
			color: #fff;
			border: none;
			border-radius: 6px;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			margin-bottom: 12px
		}

		button[type="submit"]:hover {
			background: #3a56d4
		}
	</style>
</head>

<body>
	<div class="card">
		<h1>&#x1F4B0; Expense Tracker</h1>
		<p>Create your account</p>
		<div id="alertContainer"></div>
		<form id="registerForm">
			<label for="name">Full Name</label> <input type="text" id="name" name="name" placeholder="Enter your name"
				required> <label for="email">Email Address</label> <input type="email" id="email" name="email"
				placeholder="Enter your email" required> <label for="password">Password</label> <input type="password"
				id="password" name="password" placeholder="At least 6 characters" minlength="6" required>
			<div class="hint">Password must be at least 6 characters long.</div>
			<label for="confirmPassword">Confirm Password</label> <input type="password" id="confirmPassword"
				name="confirmPassword" placeholder="Confirm your password" minlength="6" required>
			<button type="submit">Register</button>
			<p class="link">
				Already have an account? <a href="login.html">Login here</a>
			</p>
		</form>
	</div>
	<script>
		document.addEventListener('DOMContentLoaded', function () {
			document.getElementById('registerForm').addEventListener('submit', function (e) {
				e.preventDefault();
				fetch('api/register', {method: 'POST', body: new URLSearchParams(new FormData(this))})
					.then(function (r) {return r.json()})
					.then(function (data) {
						if (data.success) {showAlert(data.message, 'success'); setTimeout(function () {window.location.href = 'login.html'}, 1500)}
						else {showAlert(data.error, 'danger')}
					})
					.catch(function () {showAlert('Connection error. Please try again.', 'danger')});
			});
			function showAlert(msg, type) {
				document.getElementById('alertContainer').innerHTML = '<div class="alert alert-' + type + '"><span>' + (type === 'success' ? '&#x2714;' : '&#x26A0;') + ' ' + msg + '</span><button class="close" onclick="this.parentElement.style.display=\'none\'">&times;</button></div>';
			}
		});
	</script>
</body>

</html>
