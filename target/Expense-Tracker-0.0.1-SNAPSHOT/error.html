<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Error - Expense Tracker</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: Arial, sans-serif;
		}

		body {
			background: #f4f6f9;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.card {
			background: #fff;
			padding: 40px;
			border-radius: 12px;
			max-width: 450px;
			width: 100%;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
			text-align: center;
		}

		.ico {
			font-size: 48px;
			margin-bottom: 16px;
			color: #ff9f1c;
		}

		h2 {
			margin-bottom: 12px;
			color: #333;
		}

		p {
			color: #888;
			margin-bottom: 24px;
			font-size: 14px;
		}

		.btn {
			display: inline-block;
			padding: 8px 16px;
			border-radius: 6px;
			font-size: 13px;
			font-weight: 600;
			text-decoration: none;
			margin: 4px;
		}

		.btn-primary {
			background: #4361ee;
			color: #fff;
		}

		.btn-secondary {
			background: #888;
			color: #fff;
		}
	</style>
</head>

<body>
	<div class="card">
		<div class="ico">&#x26A0;</div>
		<h2>Oops! Something went wrong</h2>
		<p>We encountered an unexpected error. Please try again later.</p>
		<div>
			<a href="javascript:history.back()" class="btn btn-secondary">&#x2190; Go Back</a>
			<a href="dashboard" class="btn btn-primary">&#x1F3E0; Dashboard</a>
		</div>
	</div>
</body>

</html>
