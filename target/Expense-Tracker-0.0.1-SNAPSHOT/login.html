<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login - Expense Tracker</title>
	<link rel="stylesheet" href="css/style.css">
	<style>
		body {
			background: linear-gradient(135deg, #4361ee, #2d4bc8);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center
		}

		.card {
			max-width: 400px;
			padding: 40px;
			margin: 0
		}

		h1 {
			text-align: center;
			color: #4361ee;
			margin-bottom: 4px
		}

		.card p {
			text-align: center;
			color: #666;
			margin-bottom: 24px;
			font-size: 14px
		}

		.checkbox {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-bottom: 16px
		}

		.checkbox input {
			width: 16px;
			height: 16px;
			margin: 0
		}

		.checkbox label {
			font-size: 14px;
			color: #666;
			margin: 0
		}

		button[type="submit"] {
			width: 100%;
			padding: 12px;
			background: #4361ee;
			color: #fff;
			border: none;
			border-radius: 6px;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			margin-bottom: 12px
		}

		button[type="submit"]:hover {
			background: #3a56d4
		}
	</style>
</head>

<body>
	<div class="card">
		<h1>&#x1F4B0; Expense Tracker</h1>
		<p>Track your expenses efficiently</p>
		<div id="alertContainer"></div>
		<form id="loginForm">
			<label for="email">Email Address</label> <input type="email" id="email" name="email"
				placeholder="Enter your email" required>
			<label for="password">Password</label> <input type="password" id="password" name="password"
				placeholder="Enter your password" required>
			<div class="checkbox">
				<input type="checkbox" id="rememberMe" name="rememberMe"> <label for="rememberMe">Remember Me</label>
			</div>
			<button type="submit">Login</button>
			<p class="link">
				Don't have an account? <a href="register.html">Register here</a>
			</p>
		</form>
	</div>
	<script>
		document.addEventListener('DOMContentLoaded', function () {
			fetch('api/dashboard').then(function (r) {return r.json()}).then(function (data) {if (data.success) {window.location.href = 'dashboard.html'} }).catch(function () { });
			var cookies = document.cookie.split(';');
			for (var i = 0; i < cookies.length; i++) {var c = cookies[i].trim(); if (c.indexOf('rememberedEmail=') === 0) {document.getElementById('email').value = c.substring('rememberedEmail='.length); break} }
			document.getElementById('loginForm').addEventListener('submit', function (e) {
				e.preventDefault();
				fetch('api/login', {method: 'POST', body: new URLSearchParams(new FormData(this))})
					.then(function (r) {return r.json()})
					.then(function (data) {if (data.success) {window.location.href = 'dashboard.html'} else {showAlert(data.error, 'danger')} })
					.catch(function () {showAlert('Connection error. Please try again.', 'danger')});
			});
			function showAlert(msg, type) {
				document.getElementById('alertContainer').innerHTML = '<div class="alert alert-' + type + '"><span>&#x26A0; ' + msg + '</span><button class="close" onclick="this.parentElement.style.display=\'none\'">&times;</button></div>';
			}
		});
	</script>
</body>

</html>
